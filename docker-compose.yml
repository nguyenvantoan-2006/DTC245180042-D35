# ==============================================================================
# DOCKER COMPOSE CHO HỆ THỐNG QUIZ (ĐỀ 35)
# Áp dụng Hardening: Pin version, Non-root, Network Isolation, Least Privilege
# Tích hợp đầy đủ: App + MySQL + phpMyAdmin + Nginx + Prometheus + Grafana
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Cơ sở dữ liệu MySQL 8.0 (Internal Network, không publish port ra host)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0.36
    container_name: quiz-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      EXPORTER_USER: ${EXPORTER_USER}
      EXPORTER_PASSWORD: ${EXPORTER_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 2. Ứng dụng Quiz App (Node.js 20 Express)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: quiz-app:1.0.0
    container_name: quiz-app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      SESSION_SECRET: ${SESSION_SECRET}
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD}
    networks:
      - backend
      - monitoring
    # HARDENING CONTAINER APP:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Quản trị Cơ sở dữ liệu: phpMyAdmin (Cổng 127.0.0.1:8081 & qua Nginx /pma/)
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    container_name: quiz-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://localhost/pma/
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80" # Chỉ truy cập từ localhost theo đúng Hardening
    networks:
      - backend
      - frontend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 4. Reverse Proxy Nginx (HTTPS, TLS 1.2/1.3, Rate Limit, Security Headers)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25.4-alpine
    container_name: quiz-nginx
    restart: unless-stopped
    ports:
      - "8080:80" # Map sang 8080 nếu cổng 80 của Windows bị IIS/W3SVC chiếm
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      app:
        condition: service_healthy

  # ============================================================================
  # HỆ THỐNG GIÁM SÁT (MONITORING STACK) - TIÊU CHÍ 4
  # ============================================================================

  # 5. Node Exporter: Giám sát tài nguyên máy chủ host (CPU, RAM, Disk, IO)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: quiz-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128M

  # 6. cAdvisor: Giám sát mức sử dụng tài nguyên của từng Docker Container
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: quiz-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256M

  # 7. MySQL Exporter: Thu thập metrics chuyên sâu từ MySQL 8.0
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: quiz-mysqld-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${EXPORTER_USER}:${EXPORTER_PASSWORD}@(db:3306)/"
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      db:
        condition: service_healthy

  # 8. Nginx Exporter: Thu thập trạng thái kết nối và request của Nginx
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: quiz-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      - nginx

  # 9. Prometheus: Trung tâm thu thập, lưu trữ Time-Series Metrics
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: quiz-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # Chỉ mở localhost để bảo mật
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M

  # 10. Grafana: Trực quan hóa Metrics thành 3 Dashboard (Container, Web, DB)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: quiz-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-GrafanaAdminPassword_2026!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000" # Mở cổng 3001 ra host cho người dùng truy cập Grafana
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      - prometheus

  # ============================================================================
  # HỆ THỐNG QUẢN TRỊ LOG TẬP TRUNG (LOGGING STACK) - TIÊU CHÍ 5
  # ============================================================================

  # 11. Loki: Trung tâm lưu trữ và đánh chỉ mục Log (Loki 2.9.4 Schema v12)
  loki:
    image: grafana/loki:2.9.4
    container_name: quiz-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100" # Chỉ mở localhost để kiểm tra kết nối API
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 384M

  # 12. Promtail: Thu thập log từ Docker Daemon và chuyển về Loki
  promtail:
    image: grafana/promtail:2.9.4
    container_name: quiz-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M

# ==============================================================================
# ĐỊNH NGHĨA MẠNG VÀ PHÂN VÙNG CÁCH LY (NETWORK ISOLATION)
# ==============================================================================
networks:
  frontend:
    driver: bridge
  backend:
    internal: true # Mạng nội bộ cách ly hoàn toàn cơ sở dữ liệu
  monitoring:
    driver: bridge # Mạng riêng biệt cho các công cụ giám sát và thu thập log

# ==============================================================================
# LƯU TRỮ DỮ LIỆU DÙNG CHUNG (PERSISTENT VOLUMES)
# ==============================================================================
volumes:
  db_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

