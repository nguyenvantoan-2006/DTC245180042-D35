# ==============================================================================
# CẤU HÌNH REVERSE PROXY NGINX (HTTPS, SECURITY HEADERS, RATE LIMITING)
# Môn: Triển khai và Quản trị Hệ thống Phần mềm (Đề 35)
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1. Ẩn thông tin phiên bản Nginx trong response header (Hardening)
    server_tokens off;

    # Định dạng log tiêu chuẩn
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # 2. Khai báo Rate Limiting cho endpoint /login (5 request/phút, lưu trong zone 10MB)
    # Giúp ngăn chặn tấn công dò quét mật khẩu Brute-force
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_status 429;

    # 3. Khai báo Upstream backend trong mạng Docker nội bộ
    upstream app_backend {
        server app:3000;
    }

    upstream pma_backend {
        server phpmyadmin:80;
    }

    # ==========================================================================
    # CẤU HÌNH HTTP (PORT 80) -> CHUYỂN HƯỚNG BẮT BUỘC SANG HTTPS (PORT 443)
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Chuyển hướng vĩnh viễn (301 Moved Permanently) sang HTTPS
        return 301 https://$host$request_uri;
    }

    # ==========================================================================
    # CẤU HÌNH HTTPS CHÍNH (PORT 443)
    # ==========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost;

        # Chứng chỉ SSL/TLS tự ký
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Chỉ cho phép TLS 1.2 và TLS 1.3 (Loại bỏ hoàn toàn SSLv3, TLS 1.0, TLS 1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # 4. CÁC HEADER BẢO MẬT BẮT BUỘC (SECURITY HEADERS)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP: Chỉ nạp script/style/font từ chính domain 'self' (không dùng CDN ngoài)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self';" always;

        # 5. BẢO MẬT HẠ TẦNG: Chặn tuyệt đối endpoint /metrics từ bên ngoài Internet
        # Prometheus sẽ scrape trực tiếp container app qua mạng nội bộ 'monitoring'
        location /metrics {
            return 404;
        }

        # 6. Endpoint theo dõi trạng thái Nginx cho nginx-prometheus-exporter
        # Chỉ cho phép các dải IP nội bộ của Docker (172.16.0.0/12, 10.0.0.0/8, 127.0.0.1)
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # 7. Reverse Proxy cho phpMyAdmin dưới đường dẫn con /pma/
        location /pma/ {
            proxy_pass http://pma_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Nới lỏng CSP cục bộ cho phpMyAdmin hoạt động ổn định
            proxy_hide_header Content-Security-Policy;
        }

        # 8. Áp dụng Rate Limiting riêng cho endpoint đăng nhập /login
        location /login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 9. Proxy mặc định về ứng dụng Quiz App
        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ==========================================================================
    # CỔNG NỘI BỘ 8080 PHỤC VỤ NGINX-EXPORTER (MONITORING)
    # ==========================================================================
    server {
        listen 8080;
        server_name _;

        location /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}

