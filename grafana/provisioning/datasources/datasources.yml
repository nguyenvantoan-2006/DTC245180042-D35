apiVersion: 1

datasources:
  # 1. Nguồn dữ liệu Prometheus Metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 10s

  # 2. Nguồn dữ liệu Loki Logs (Sẵn sàng cho Bước 3)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
