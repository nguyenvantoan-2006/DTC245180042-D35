apiVersion: 1

providers:
  - name: 'Quiz System Dashboards'
    orgId: 1
    folder: 'Quiz System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
